<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060e0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Elif-Be">
  <title>Elif-Be | Kur'an Öğreniyorum (Sesli & Kaydırmalı)</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Google Fonts: Amiri & Scheherazade for Quranic Calligraphy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #040a07;
      --bg-surface: #0a1811;
      --bg-card: rgba(12, 28, 20, 0.92);
      --emerald-primary: #10B981;
      --emerald-dark: #064E3B;
      --gold-primary: #D4AF37;
      --gold-light: #FDF0CD;
      --gold-gradient: linear-gradient(135deg, #FFF5D6 0%, #D4AF37 50%, #99781E 100%);
      --emerald-gradient: linear-gradient(135deg, #34D399 0%, #059669 100%);
      --gold-border: rgba(212, 175, 55, 0.35);
      --text-main: #F0FDF4;
      --text-muted: #94A3B8;
      --accent-glow: rgba(212, 175, 55, 0.28);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Ambient Quranic Pattern Background */
    .ambient-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 25%, rgba(16, 185, 129, 0.08) 0%, transparent 65%),
                  radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.06) 0%, #040a07 100%);
      z-index: 0;
    }

    /* Top Progress Line */
    .scroll-progress-line {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--gold-gradient);
      width: 3%;
      z-index: 100;
      transition: width 0.2s ease-out;
    }

    /* Top Sticky Header */
    header.top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      padding: calc(var(--safe-top) + 8px) 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: linear-gradient(to bottom, rgba(4,10,7,0.98) 0%, rgba(4,10,7,0.85) 85%, transparent 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .header-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .quran-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--gold-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
      font-size: 20px;
      flex-shrink: 0;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header-action {
      padding: 0 12px;
      height: 34px;
      border-radius: 18px;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-header-action:active {
      transform: scale(0.96);
      background: rgba(212, 175, 55, 0.2);
    }

    /* Stage / Level Tabs */
    .stage-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .stage-tabs::-webkit-scrollbar { display: none; }

    .stage-tab {
      flex: 1;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(10, 24, 17, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stage-tab.active {
      background: var(--gold-gradient);
      color: #040A07;
      border-color: #FFF3D1;
      box-shadow: 0 0 14px var(--accent-glow);
      font-weight: 700;
    }

    /* SCROLL CONTAINER (Snap-Scroll) */
    #scroll-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    #scroll-container::-webkit-scrollbar { display: none; }

    /* CARD WRAPPER */
    .letter-card-wrapper {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 95px) 18px calc(var(--safe-bottom) + 80px);
      box-sizing: border-box;
    }

    .letter-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1.5px solid var(--gold-border);
      border-radius: 30px;
      padding: 22px 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 30px rgba(16, 185, 129, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    .card-meta-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold-light);
      border: 1px solid var(--gold-border);
      padding: 3px 12px;
      border-radius: 14px;
      background: rgba(212, 175, 55, 0.12);
    }

    .badge-type {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.18);
      color: #6EE7B7;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    /* GIANT ARABIC LETTER MEDALLION */
    .giant-letter-frame {
      width: 180px;
      height: 180px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    .letter-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed var(--gold-primary);
      opacity: 0.45;
      animation: rotateRing 60s linear infinite;
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .giant-arabic {
      font-family: 'Amiri', 'Scheherazade New', serif;
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.5));
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .giant-arabic:active {
      transform: scale(1.1);
    }

    .turkish-letter-name {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 1px;
      text-align: center;
    }

    /* Main Big Audio Button */
    .btn-play-audio {
      width: 100%;
      height: 48px;
      border-radius: 16px;
      background: var(--gold-gradient);
      border: none;
      color: #040A07;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
      transition: all 0.2s ease;
    }
    .btn-play-audio:active {
      transform: scale(0.97);
    }

    /* Mahrec Box */
    .mahrec-box {
      width: 100%;
      background: rgba(6, 14, 10, 0.65);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mahrec-tag {
      font-size: 11px;
      font-weight: 700;
      color: #6EE7B7;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .mahrec-desc {
      font-size: 12.5px;
      line-height: 1.55;
      color: #E2E8F0;
    }

    /* Harekeler Row in Card */
    .harekeler-preview-box {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .hareke-btn {
      background: rgba(10, 24, 17, 0.85);
      border: 1px solid var(--gold-border);
      border-radius: 14px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hareke-btn:active {
      background: rgba(212, 175, 55, 0.25);
      transform: scale(0.95);
    }
    .hareke-ar {
      font-family: 'Amiri', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1;
    }
    .hareke-lbl {
      font-size: 11px;
      font-weight: 600;
      color: #A7F3D0;
    }

    /* Yazılış Şekilleri Kutusu */
    .shapes-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(6, 14, 10, 0.5);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 8px 10px;
    }
    .shape-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .shape-ar {
      font-family: 'Amiri', serif;
      font-size: 24px;
      color: var(--gold-light);
    }
    .shape-lbl {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Floating Navigation Controls */
    .floating-scroll-controls {
      position: fixed;
      right: 14px;
      bottom: calc(var(--safe-bottom) + 78px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 40;
    }

    .scroll-arrow-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(10, 24, 17, 0.94);
      border: 1.5px solid var(--gold-border);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .scroll-arrow-btn:active {
      transform: scale(0.9);
      background: var(--gold-gradient);
      color: #040A07;
    }

    /* Bottom Control Bar */
    nav.bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      padding: 8px 16px calc(var(--safe-bottom) + 10px);
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: linear-gradient(to top, rgba(4,10,7,0.98) 0%, rgba(4,10,7,0.85) 75%, transparent 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(212, 175, 55, 0.15);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s ease;
      min-width: 68px;
    }
    .nav-icon-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .nav-item:active .nav-icon-circle {
      transform: scale(0.95);
      background: var(--gold-gradient);
      color: #040A07;
    }

    /* Modal Sheet Styling */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 10, 7, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      border-bottom: none;
      border-radius: 28px 28px 0 0;
      padding: 24px 20px calc(var(--safe-bottom) + 24px);
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-backdrop.open .modal-card {
      transform: translateY(0);
    }

    .modal-handle {
      width: 44px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      align-self: center;
      margin-bottom: -6px;
    }

    .search-input {
      width: 100%;
      height: 44px;
      border-radius: 14px;
      background: rgba(4, 10, 7, 0.85);
      border: 1px solid var(--gold-border);
      padding: 0 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .fihrist-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 4px;
    }
    .fihrist-btn {
      background: rgba(12, 28, 20, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .fihrist-btn:active {
      background: var(--gold-gradient);
      color: #040A07;
    }
    .fihrist-ar {
      font-family: 'Amiri', serif;
      font-size: 32px;
      color: var(--gold-light);
    }
    .fihrist-tr {
      font-size: 12px;
      font-weight: 600;
      color: #CBD5E1;
    }
  </style>
</head>
<body>
  <!-- Hidden HTML5 Audio Element for Real Human Audio MP3s -->
  <audio id="letter-audio" preload="auto"></audio>

  <div id="app">
    <!-- Top Progress Line -->
    <div class="scroll-progress-line" id="scroll-progress"></div>

    <!-- Ambient Emerald & Gold Glow -->
    <div class="ambient-bg"></div>

    <!-- Top Sticky Header -->
    <header class="top-bar">
      <div class="header-main-row">
        <div class="brand-section" onclick="openFihrist()">
          <div class="quran-badge">📖</div>
          <div class="brand-titles">
            <span class="brand-title">Kur'an Elif-Bâ'sı</span>
            <span class="brand-subtitle">Kaydırmalı & Güçlü Sesli Talim</span>
          </div>
        </div>

        <div class="top-actions">
          <button class="btn-header-action" onclick="openFihrist()">
            <span>🔍</span>
            <span>28 Harf</span>
          </button>
        </div>
      </div>

      <!-- Stage / Level Tabs -->
      <div class="stage-tabs">
        <button class="stage-tab active" id="tab-1" onclick="switchStage(1)">📗 1. Harfler (Yalın)</button>
        <button class="stage-tab" id="tab-2" onclick="switchStage(2)">📙 2. Harekeler (E - İ - Ü)</button>
        <button class="stage-tab" id="tab-3" onclick="switchStage(3)">📕 3. İleri (Cezm • Şedde • Tenvin)</button>
      </div>
    </header>

    <!-- MAIN SCROLL FEED -->
    <main id="scroll-container">
      <!-- Cards rendered here via JS -->
    </main>

    <!-- Floating Up/Down Arrows -->
    <div class="floating-scroll-controls">
      <button class="scroll-arrow-btn" title="Önceki Harf" onclick="scrollPrev()">▲</button>
      <button class="scroll-arrow-btn" title="Sonraki Harf" onclick="scrollNext()">▼</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-bar">
      <button class="nav-item" onclick="scrollToIndex(0)">
        <div class="nav-icon-circle">☝️</div>
        <span>Elif (Başa)</span>
      </button>

      <button class="nav-item" onclick="playCurrentActiveAudio()">
        <div class="nav-icon-circle" style="background:var(--gold-gradient); color:#040A07;">🔊</div>
        <span style="color:var(--gold-light); font-weight:700;">Sesi Çal</span>
      </button>

      <button class="nav-item" onclick="openFihrist()">
        <div class="nav-icon-circle">📑</div>
        <span>Fihrist</span>
      </button>
    </nav>
  </div>

  <!-- FIHRIST (INDEX) MODAL -->
  <div class="modal-backdrop" id="fihrist-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-card">
      <div class="modal-handle"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="badge-pill">28 Harf Fihristi</span>
        <button class="close-btn" onclick="closeFihrist()" style="background:none; border:none; color:#94A3B8; font-size:20px; cursor:pointer;">✕</button>
      </div>

      <input type="text" class="search-input" id="search-input" placeholder="Harf ara (ör: Elif, Be, Cim, Kaf)..." oninput="filterFihrist()">

      <div class="fihrist-list" id="fihrist-grid"></div>
    </div>
  </div>

  <script>

                    <div class="hareke-btn" onclick="speakArabicText('${ex.ar}')" style="padding:10px;">
                      <div class="hareke-ar" style="font-size:28px;">${ex.ar}</div>
                      <div class="hareke-lbl" style="font-size:12px; color:#FFF3D1;">${ex.tr}</div>
                      <div style="font-size:10px; color:#94A3B8;">${ex.desc}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </section>
        `;
      });

      container.innerHTML = html;
      setupScrollObserver();
    }

    // Scroll Observer
    function setupScrollObserver() {
      const container = document.getElementById('scroll-container');
      const wrappers = document.querySelectorAll('.letter-card-wrapper');
      const progressLine = document.getElementById('scroll-progress');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const idx = parseInt(entry.target.getAttribute('data-index'));
            currentActiveIndex = idx;
            const stage = entry.target.getAttribute('data-stage');
            updateStageTabUI(stage);

            const total = wrappers.length;
            const progress = ((idx + 1) / total) * 100;
            if (progressLine) progressLine.style.width = progress + '%';
          }
        });
      }, {
        root: container,
        threshold: 0.55
      });

      wrappers.forEach(w => observer.observe(w));
    }

    function updateStageTabUI(stage) {
      document.querySelectorAll('.stage-tab').forEach((t, i) => {
        if ((i + 1) == stage) t.classList.add('active');
        else t.classList.remove('active');
      });
    }

    function switchStage(stageNum) {
      if (stageNum === 1) scrollToIndex(0);
      else if (stageNum === 2) scrollToIndex(lettersData.length);
      else if (stageNum === 3) scrollToIndex(lettersData.length + 3);
    }

    function scrollNext() {
      const total = document.querySelectorAll('.letter-card-wrapper').length;
      if (currentActiveIndex < total - 1) {
        scrollToIndex(currentActiveIndex + 1);
      }
    }

    function scrollPrev() {
      if (currentActiveIndex > 0) {
        scrollToIndex(currentActiveIndex - 1);
      }
    }

    function scrollToIndex(idx) {
      const target = document.getElementById('card-' + idx);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        scrollNext();
      } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        scrollPrev();
      }
    });

    // Fihrist Modal
    function openFihrist() {
      renderFihristGrid(lettersData);
      document.getElementById('fihrist-modal').classList.add('open');
    }

    function closeFihrist() {
      document.getElementById('fihrist-modal').classList.remove('open');
    }

    function renderFihristGrid(list) {
      const grid = document.getElementById('fihrist-grid');
      grid.innerHTML = list.map((item, idx) => `
        <div class="fihrist-btn" onclick="selectFromFihrist(${idx})">
          <div class="fihrist-ar">${item.ar}</div>
          <div class="fihrist-tr">${item.trName}</div>
        </div>
      `).join('');
    }

    function filterFihrist() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = lettersData.filter(l => 
        l.tr.toLowerCase().includes(q) || 
        l.trName.toLowerCase().includes(q) || 
        l.ar.includes(q)
      );
      renderFihristGrid(filtered);
    }

    function selectFromFihrist(idx) {
      closeFihrist();
      scrollToIndex(idx);
    }

    function closeModalOnBackdrop(e) {
      if (e.target.classList.contains('modal-backdrop')) {
        closeFihrist();
      }
    }

    // Initialize
    renderApp();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(e => console.log('SW error:', e));
      });
    }
  </script>
</body>
</html>
