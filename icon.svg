<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E2E20"/>
      <stop offset="100%" stop-color="#040A07"/>
    </radialGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgG)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldG)" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldG)" stroke-width="2"/>
  <!-- Islamic 8-Pointed Star -->
  <rect x="156" y="156" width="200" height="200" rx="12" fill="none" stroke="url(#goldG)" stroke-width="3" transform="rotate(0 256 256)"/>
  <rect x="156" y="156" width="200" height="200" rx="12" fill="none" stroke="url(#goldG)" stroke-width="3" transform="rotate(45 256 256)"/>
  <!-- Quranic Calligraphy Elif & Ba -->
  <text x="256" y="320" text-anchor="middle" font-family="'Amiri', 'Times New Roman', serif" font-size="160" font-weight="bold" fill="url(#goldG)">ا</text>
  <text x="256" y="440" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="#E2E8F0" letter-spacing="3">ELİF - BE</text>
</svg>